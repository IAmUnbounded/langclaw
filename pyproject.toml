[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-lang"
version = "0.1.0"
description = "OpenClaw-equivalent personal AI assistant built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "deepagents>=0.6.1",
    "langgraph>=1.2.0",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=4.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
memory = ["chromadb>=0.5.0"]
telegram = ["python-telegram-bot>=21.0"]
discord = ["discord.py>=2.4.0"]
whatsapp = ["neonize>=0.3.0"]
mcp = ["mcp>=1.0.0"]
tokens = ["tiktoken>=0.7.0"]
image = ["Pillow>=10.0.0"]
browser = ["websockets>=13.0"]
tts = ["edge-tts>=6.1.0"]
slack = ["slack-bolt>=1.20.0"]
signal = ["pysignalclirestapi>=0.3.0"]
line = ["line-bot-sdk>=3.0.0"]
embeddings = ["voyageai>=0.2.0"]
all = ["openclaw-lang[memory,telegram,discord,whatsapp,mcp,tokens,image,browser,tts,slack,signal,line,embeddings]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "pytest-httpx>=0.30.0"]

[project.scripts]
openclaw = "openclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw"]
